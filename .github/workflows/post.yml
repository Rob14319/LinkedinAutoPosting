name: Daily LinkedIn Post

on:
  schedule:
    - cron: '35 10 * * *'  # 4:05 PM IST (UTC+5:30) for testing
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  generate:
    name: Generate Post & Notify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Post and Update Summary
        run: python main.py --generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          
      - name: Upload draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-draft
          path: draft.txt
          retention-days: 1

  publish:
    name: Publish to LinkedIn
    needs: generate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download draft artifact
        uses: actions/download-artifact@v4
        with:
          name: post-draft
          
      - name: Publish Post
        run: python main.py --post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
