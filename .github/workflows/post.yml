name: LinkedIn Automation

on:
  schedule:
    - cron: '30 4 * * *'  # 10:00 AM IST
    - cron: '30 8 * * *'  # 2:00 PM IST
    - cron: '30 12 * * *' # 6:00 PM IST
    - cron: '30 17 * * *' # 11:00 PM IST
  workflow_dispatch:      # Manual trigger for generation
  repository_dispatch:     # Trigger for publishing from the Portal
    types: [publish_post, publish_comment]

jobs:
  generate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Generate Post & Notify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Post and Send Email
        run: |
          if [ "${{ github.event.schedule }}" = "30 4 * * *" ] || [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            python main.py --generate --type long
          elif [ "${{ github.event.schedule }}" = "30 8 * * *" ] || [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
            python main.py --generate --type short
          else
            python main.py --generate
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}

  publish:
    if: github.event.action == 'publish_post'
    name: Publish to LinkedIn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish Post
        run: python main.py --post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          POST_CONTENT: ${{ github.event.client_payload.content }}
          POST_COMMENT: ${{ github.event.client_payload.comment }}
          POST_IMAGE: ${{ github.event.client_payload.imageUrl }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}

  engage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Discover & Draft Engagement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py --engage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}

      - name: Reply to Comments on My Posts
        run: python main.py --reply-comments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}

  comment:
    if: github.event.action == 'publish_comment'
    name: Post Comment to Target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py --post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_COMMENT: ${{ github.event.client_payload.comment }}
          POST_ACTIVITY_ID: ${{ github.event.client_payload.activityId }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
